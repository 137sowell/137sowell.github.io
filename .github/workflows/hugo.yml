name: 构建并部署到 GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:      # 也可以在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一个部署在跑，新的推送会等当前这次跑完
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0     # 与本地版本保持一致，升级时改这里
    steps:
      - name: 安装 Hugo（extended 版）
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0        # 让 .GitInfo / .Lastmod 可用

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 缓存 Hugo 生成的图片等资源
        uses: actions/cache@v4
        with:
          path: |
            resources/_gen
            .hugo_build.lock
          key: hugo-${{ runner.os }}-${{ hashFiles('**/*.md', 'assets/**', 'config/**') }}
          restore-keys: hugo-${{ runner.os }}-

      - name: 构建站点
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          TZ: Asia/Shanghai
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
