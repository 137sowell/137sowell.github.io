# -- 主题参数 --
# 每一项的详细说明见 https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "almond"         # 自定义配色，见 assets/css/schemes/almond.css
                               # 取自梵高《杏花》的青绿主色，和背景图配套
                               # 内置可选：blowfish / ocean / forest / autumn / noir / slate / fire ...
defaultAppearance = "light"    # 默认亮色还是暗色：light / dark
autoSwitchAppearance = false   # false = 固定用上面的亮色起步（右上角图标仍可手动切深色）
                               # 改成 true 就跟随系统的深色模式

enableSearch = true            # 站内搜索（顶部放大镜）
enableCodeCopy = true          # 代码块一键复制
enableA11y = false

mainSections = ["posts", "gallery"]   # 首页“最近”里同时列出日志和相册

# 没有单独指定封面图时使用的兜底图片，文件放在 assets/ 下
defaultBackgroundImage = "img/hero.jpg"
defaultFeaturedImage = "img/hero.jpg"

disableImageOptimization = false   # false = 由 Hugo 自动压缩/生成多尺寸图，照片站建议保持
smartTOC = true

[header]
  layout = "fixed"             # basic / fixed / fixed-fill / fixed-gradient / fixed-fill-blur

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "background"        # page / profile / hero / card / background / custom
                               # background = 大图固定在页面背后，内容滚过去时逐渐模糊
  homepageImage = "img/hero.jpg"   # 首页背景大图（现在是梵高《杏花》），换成自己的照片即可
  showRecent = true            # 首页下方显示最新文章
  showRecentItems = 6
  showMoreLink = true
  showMoreLinkDest = "posts"
  cardView = true              # 最新文章用卡片（带缩略图）形式展示
  layoutBackgroundBlur = true  # 往下滚时背景逐渐模糊（仅 background 版式生效）
  disableHeroImageFilter = true    # 关闭大图上的紫蓝色滤镜（仅 hero 版式生效）

[article]
  showDate = true
  showDateUpdated = false
  showAuthor = false
  showViews = false
  showLikes = false
  showHero = true
  heroStyle = "background"     # basic / big / background / thumbAndBackground
                               # background = 和首页一样，图片固定在页面背后
  layoutBackgroundBlur = true
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false             # 不显示“在 GitHub 上编辑此页”
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showTableOfContents = false  # 随笔类文章一般不需要目录，技术长文可改 true
  showRelatedContent = true
  relatedContentLimit = 3
  showTaxonomies = true
  showWordCount = false
  showZenMode = true
  sharingLinks = ["twitter", "telegram", "email"]

[list]
  showHero = true
  heroStyle = "background"     # 列表页也用固定背景
  layoutBackgroundBlur = true
  showBreadcrumbs = false
  showSummary = true
  showTableOfContents = false
  showCards = true
  cardView = true
  groupByYear = true           # 列表按年份分组，写日志很好用
  orderByWeight = false

[taxonomy]
  showTermCount = true
  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true
  showBreadcrumbs = false
  showTableOfContents = false
  cardView = false

[term]
  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true
  showBreadcrumbs = false
  showTableOfContents = false
  groupByYear = false
  cardView = true

[verification]
  # google = ""
  # bing = ""
